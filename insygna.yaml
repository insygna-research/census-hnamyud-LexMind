schema: "1.0"
name: "LexMind"
description: |
  Hệ thống chatbot tư vấn Luật Giao thông đường bộ Việt Nam. Sử dụng kỹ thuật RAG kết hợp Knowledge Graph để đảm bảo thông tin chính xác và cập nhật. Primary language: python; ships a container definition; observed outbound integrations: api.openai.com, generativelanguage.googleapis.com.
category: "Legal / Compliance"
license: "mit"
pricing:
  trial:
    days: 14
  model: per_token
  apis:
    - url_pattern: "api.openai.com"
      type: free
      note: "openai -- third-party corpus entry; usage tracked, not billed."
    - url_pattern: "generativelanguage.googleapis.com"
      type: free
      note: "google -- third-party corpus entry; usage tracked, not billed."
tags:
  - "insygna-census"
  - "legal"
  - "fastapi"
  - "knowledge-graph"
  - "langgraph"
  - "langsmith"
  - "python"

# The app container: ai-service, the compose service the build promotes (no root Dockerfile), which
# loads the ONNX embedding model (compose: mem_limit 3g). The others are sized under runtime.containers,
# their memory limits taken from docker-compose.yml's mem_limit where it sets one.
resources:
  cpu:
    request: "500m"
    limit: "2"
  memory:
    request: "2Gi"
    limit: "3Gi"

runtime:
  containers:
    - name: ai-service
      role: app
    - name: redis
      role: auxiliary
      resources:
        cpu: { request: "100m", limit: "500m" }
        memory: { request: "256Mi", limit: "512Mi" }
    - name: core-api
      role: auxiliary
      resources:
        cpu: { request: "250m", limit: "1" }
        memory: { request: "256Mi", limit: "512Mi" }
    - name: core-migrate
      role: auxiliary
      resources:
        cpu: { request: "100m", limit: "500m" }
        memory: { request: "128Mi", limit: "256Mi" }
    - name: core-mail-worker
      role: auxiliary
      resources:
        cpu: { request: "50m", limit: "250m" }
        memory: { request: "128Mi", limit: "256Mi" }
